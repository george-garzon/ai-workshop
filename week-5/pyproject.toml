[project]
name = "week-5"
version = "0.1.0"
description = "Agent fundamentals scaffold"
readme = "README.md"
authors = [
    { name = "George Garzon", email = "george.garzon@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.3.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
